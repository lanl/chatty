name: tests

# The test suite on every push to main and every pull request. No paths filter:
# a filter that skips a PR is how a regression lands unseen.
#
# stdin is closed for pytest. The integration tests drive Textual apps, and with an
# open stdin a run stalled partway through them. --timeout fails a hung test
# with its stack instead of leaving the job to run until timeout-minutes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --dev --locked

      # tiktoken downloads its encodings on first use; tests/conftest.py loads them
      # before it blocks DNS. Caching them spares each run the download.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiktoken
          key: tiktoken-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: tiktoken-${{ runner.os }}-

      - name: pytest
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        shell: bash
        run: uv run --no-sync pytest -n auto --timeout=120 < /dev/null

      # Uploaded only when the snapshot test fails, so a reviewer can see what
      # changed without reproducing it.
      - name: Upload snapshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-report-${{ matrix.os }}-py${{ matrix.python }}
          path: snapshot_report.html
          if-no-files-found: ignore
