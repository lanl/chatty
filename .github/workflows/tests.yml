name: tests

# The test suite on every push to main and every pull request. No paths filter:
# a filter that skips a PR is how a regression lands unseen.
#
# Windows is untested (README, "Windows Support"), so its leg reports but does not
# gate: continue-on-error keeps a red Windows run from failing the PR. Make it
# required once the suite passes there.
#
# stdin is closed for pytest. The integration tests drive Textual apps, and with an
# open stdin a run stalled partway through them.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        experimental: [false]
        include:
          - os: windows-latest
            python: "3.13"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --dev --locked

      - name: pytest
        shell: bash
        run: uv run --no-sync pytest -n auto < /dev/null

      # Uploaded only when the snapshot test fails, so a reviewer can see what
      # changed without reproducing it.
      - name: Upload snapshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-report-${{ matrix.os }}-py${{ matrix.python }}
          path: snapshot_report.html
          if-no-files-found: ignore
