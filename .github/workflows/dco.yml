name: dco

# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (CONTRIBUTING.md, "Certificate of origin"): a Signed-off-by trailer
# whose email matches the commit's author. Merge commits are skipped. The fix is
# `git rebase --signoff main && git push --force-with-lease`.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: commits are signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email="$(git log -1 --format='%ae' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by for <$email>"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with: git rebase --signoff main && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
