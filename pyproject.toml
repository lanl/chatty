[project]
name = "chatty"
version = "0.3.0"
description = "A terminal UI chatbot for OpenAI-compatible endpoints"
readme = "README.md"
license = { text = "TBD" }
requires-python = ">=3.11"
authors = [
    { name = "LANL" }
]
keywords = ["chatbot", "llm", "terminal", "tui", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "textual>=0.40",
    "httpx>=0.25",
    "httpx-sse>=0.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tomli>=2.0;python_version<'3.11'",
    "typer>=0.9",
    "rich>=13.0",
    "tiktoken>=0.5",
    "pyperclip>=1.11.0",
]

[project.optional-dependencies]
rag = [
    "faiss-cpu>=1.8,<1.9",
    "numpy<2",
]

[project.scripts]
chatty = "chatty.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatty"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.20",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pytest-textual-snapshot>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for typer)
]

[tool.ruff.lint.isort]
known-first-party = ["chatty"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tiktoken.*",
    "litkit.*",
    "pytest.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require real endpoint)",
]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/chatty"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
